spring.application.name=iw3
spring.jackson.serialization.indent-output=true
# Puerto del servidor
server.port=8080

# ===================================================================
# Configuración de Base de Datos MySQL
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/iw3_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.open-in-view=false

# ===================================================================
# Configuración de Logs
# ===================================================================
logging.level.root=WARN
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR

spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.type=WARN

logging.level.com.zaxxer.hikari.HikariConfig=DEBUG 
logging.level.com.zaxxer.hikari=INFO


spring.datasource.hikari.connection-timeout=60000 
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000  
spring.datasource.hikari.max-lifetime=1800000 
spring.datasource.hikari.auto-commit=false

logging.level.ar.edu.iua.iw3.Iw3Application=DEBUG