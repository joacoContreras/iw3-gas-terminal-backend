spring.application.name=iw3
spring.jackson.serialization.indent-output=true

dev.info.enabled=true
spring.jackson.time-zone=America/Argentina/Buenos_Aires
# Las fechas se guardan en la base con la hora de Argentina, sin importar la zona de la JVM
# ni el serverTimezone de la URL (sin esto MySQL recibia UTC, 3 h adelantada; hallazgo H-8).
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# Puerto del servidor
server.port=8080

# ===================================================================
# Configuración de Base de Datos MySQL
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/iw3_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.open-in-view=false

# ===================================================================
# Configuración de Logs
# ===================================================================
logging.level.root=WARN
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR

spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.type=WARN

logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=INFO


spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

logging.level.ar.edu.iua.iw3.Iw3Application=DEBUG

# ===================================================================
# Correo de la alarma de temperatura (examen final)
# Las credenciales NUNCA van en el repositorio: se definen como variables de entorno
# (SMTP_USER y SMTP_PASS, como en la catedra). Sin ellas el aviso falla, se registra y la lectura se guarda igual.
# ===================================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Umbral de temperatura (grados C) mientras nadie lo configure por la API
alarm.default-threshold=${ALARM_DEFAULT_THRESHOLD:30.0}
# Remitente de respaldo si no hay cuenta SMTP (con SMTP_USER definido, el remitente es esa cuenta)
alarm.mail.from=${ALARM_MAIL_FROM:alarmas@iw3.local}
